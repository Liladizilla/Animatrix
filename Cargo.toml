[workspace]
members = [
  "crates/animatrix-core",
  "crates/animatrix-domain",
  "crates/animatrix-ai",
  "crates/animatrix-ai-router",
  "crates/animatrix-jobs",
  "crates/animatrix-project",
  "crates/animatrix-assets",
  "crates/animatrix-events",
  "crates/animatrix-storage",
  "crates/animatrix-application",
  "crates/animatrix-ui",
]
resolver = "2"

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["Animatrix Team"]

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio-rustls", "chrono", "uuid"] }
